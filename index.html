<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; background: #0f0c08; font-family: "DM Sans", sans-serif; color: #f5efe6; }

.page { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }

/* Background */
.bg-photo { position: absolute; inset: 0; z-index: 0; }
.bg-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 8%; animation: fadeIn 1s ease forwards; }
.bg-photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom,
    rgba(15,12,8,0) 0%,
    rgba(15,12,8,0) 30%,
    rgba(15,12,8,0.6) 52%,
    rgba(15,12,8,0.93) 65%,
    rgba(15,12,8,0.97) 75%,
    rgba(15,12,8,0.99) 100%);
}

/* Bottom content */
.hotzone {
  position: absolute;
  bottom: 25vh;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
  padding: 0 1.6rem calc(1.4rem + env(safe-area-inset-bottom, 0px));
}

/* Urgency bar */
.urgency {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(201,147,58,0.15);
  border: 1px solid rgba(201,147,58,0.35);
  border-radius: 50px;
  padding: 0.35rem 0.9rem;
  margin-bottom: 0.75rem;
  animation: fadeUp 0.6s ease 0.3s both;
}
.urgency-dot { width: 7px; height: 7px; background: #c9933a; border-radius: 50%; animation: pulse 2s infinite; flex-shrink: 0; }
.urgency-text { font-size: 0.72rem; letter-spacing: 0.08em; color: #c9933a; font-weight: 500; }
#countdown { font-variant-numeric: tabular-nums; }

/* Headline */
h1 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(2.2rem, 7vw, 3.6rem);
  font-weight: 300;
  line-height: 1.06;
  color: #f5efe6;
  margin-bottom: 0.15rem;
  animation: fadeUp 0.7s ease 0.45s both;
}
h1 em { font-style: italic; color: #d4a574; }

.sub {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(1.1rem, 4vw, 1.6rem);
  font-style: italic;
  color: rgba(245,239,230,0.55);
  margin-bottom: 0.85rem;
  animation: fadeUp 0.7s ease 0.55s both;
}

/* Social proof */
.social-proof {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.9rem;
  margin-bottom: 1rem;
  animation: fadeUp 0.7s ease 0.62s both;
}
.stars { color: #c9933a; font-size: 0.85rem; letter-spacing: 0.05em; }
.divider { width: 1px; height: 14px; background: rgba(245,239,230,0.2); }
.subs { font-size: 0.75rem; color: rgba(245,239,230,0.55); font-weight: 400; }
.subs strong { color: rgba(245,239,230,0.85); font-weight: 500; }

/* CTA */
.cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;
  width: 100%;
  max-width: 340px;
  background: #24a1de;
  color: #fff;
  text-decoration: none;
  font-size: 1.05rem;
  font-weight: 500;
  padding: 1rem 1.8rem;
  border-radius: 50px;
  box-shadow: 0 8px 32px rgba(36,161,222,0.45);
  transition: transform 0.2s, box-shadow 0.2s;
  animation: fadeUp 0.7s ease 0.72s both;
  -webkit-tap-highlight-color: transparent;
}
.cta:active { transform: scale(0.97); box-shadow: 0 4px 16px rgba(36,161,222,0.3); }

/* Micro CTA */
.micro-cta {
  margin-top: 0.7rem;
  font-size: 0.72rem;
  color: rgba(245,239,230,0.35);
  animation: fadeUp 0.7s ease 0.82s both;
  letter-spacing: 0.03em;
}
.micro-cta span { color: rgba(245,239,230,0.55); text-decoration: underline; text-underline-offset: 3px; }

/* Desktop */
@media (min-width: 641px) {
  .bg-photo::after {
    background:
      linear-gradient(to right, rgba(15,12,8,0.05) 0%, rgba(15,12,8,0.6) 50%, rgba(15,12,8,0.97) 100%),
      linear-gradient(to top, rgba(15,12,8,0.4) 0%, transparent 35%);
  }
  .hotzone { align-items: flex-end; text-align: right; padding: 0 4rem 3rem; max-width: 560px; margin-left: auto; }
  .cta { max-width: 320px; }
  .urgency { align-self: flex-end; }
  .social-proof { justify-content: flex-end; }
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
</style>
</head>
<body>
<div class="page">
  <div class="bg-photo">
    <img src="IMAGEN.jpg" alt="" />
  </div>

  <div class="hotzone">

    <!-- Urgency bar -->
    <div class="urgency">
      <div class="urgency-dot"></div>
      <span class="urgency-text">This gift expires in <span id="countdown">23:47</span></span>
    </div>

    <!-- Headline -->
    <h1>I have something<br><em>just for you</em></h1>
    <p class="sub">only for you 😈</p>

    <!-- Social proof -->
    <div class="social-proof">
      <span class="stars">★★★★★</span>
      <div class="divider"></div>
      <span class="subs"><strong>+2,400</strong> fans already inside</span>
    </div>

    <!-- CTA -->
    <a href="https://www.fanvue.com/anamarieoff"
       class="cta"
       target="_blank"
       rel="noopener"
       onclick="fbq('track', 'AddPaymentInfo');">
      Claim my gift →
    </a>

  </div>
</div>

<script>
  // Countdown timer — persists across reloads via localStorage
  (function () {
    const KEY = 'anna_cd_end';
    const DURATION = 23 * 60 + 47; // seconds
    let endTime = localStorage.getItem(KEY);

    if (!endTime) {
      endTime = Date.now() + DURATION * 1000;
      localStorage.setItem(KEY, endTime);
    } else {
      endTime = parseInt(endTime);
    }

    function update() {
      const remaining = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      document.getElementById('countdown').textContent = m + ':' + s;

      if (remaining <= 0) {
        // Reset for next visit
        localStorage.removeItem(KEY);
      }
    }

    update();
    setInterval(update, 1000);
  })();
</script>
</body>
</html>
