<style>

*,
*::before,
*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;

  background:#071018;

  font-family:"DM Sans",sans-serif;

  color:#fff;
}

.page{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* BACKGROUND */

.bg-photo{
  position:absolute;
  inset:0;
  z-index:0;
}

.bg-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;

  animation:fadeIn 1s ease forwards;
}

.bg-photo::after{
  content:"";
  position:absolute;
  inset:0;

  background:
  linear-gradient(
    to bottom,
    rgba(7,16,24,0.02) 0%,
    rgba(7,16,24,0.15) 30%,
    rgba(7,16,24,0.78) 68%,
    rgba(7,16,24,0.98) 100%
  );
}

/* CONTENT */

.hotzone{
  position:absolute;
  bottom:17vh;
  left:0;
  right:0;

  z-index:2;

  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;

  width:100%;

  padding:0 1.6rem;
}

/* ONLINE BADGE */

.profile-badge{
  display:flex;
  align-items:center;
  gap:.6rem;

  background:rgba(255,255,255,.10);

  border:1px solid rgba(255,255,255,.14);

  backdrop-filter:blur(16px);

  padding:.65rem 1rem;

  border-radius:999px;

  margin-bottom:1rem;

  animation:fadeUp .7s ease .2s both;
}

.online-dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0 0 0 5px rgba(34,197,94,.18);

  animation:pulse 1.5s infinite;
}

.profile-badge span{
  font-size:.82rem;

  color:rgba(255,255,255,.92);

  font-weight:500;
}

/* HEADLINE */

h1{
  font-family:"Cormorant Garamond",serif;

  font-size:clamp(2.5rem,7vw,4rem);

  line-height:1.02;

  font-weight:300;

  margin-bottom:.2rem;

  color:#fff;

  animation:fadeUp .7s ease .35s both;
}

h1 em{
  color:#7dd3fc;
  font-style:italic;
}

.sub{
  font-family:"Cormorant Garamond",serif;

  font-style:italic;

  font-size:clamp(1.1rem,4vw,1.55rem);

  color:rgba(255,255,255,.62);

  margin-bottom:1.3rem;

  animation:fadeUp .7s ease .45s both;
}

/* BUTTON */

.cta{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:.7rem;

  width:100%;
  max-width:360px;

  background:#ffffff;

  color:#229ED9;

  text-decoration:none;

  font-size:1rem;
  font-weight:700;

  padding:1rem 1.5rem;

  border-radius:999px;

  box-shadow:
    0 12px 34px rgba(255,255,255,.18);

  transition:
    transform .2s ease,
    box-shadow .2s ease;

  animation:
    fadeUp .7s ease .58s both,
    floatButton 2.6s ease-in-out infinite;

  -webkit-tap-highlight-color:transparent;
}

.cta:hover{
  transform:translateY(-2px) scale(1.02);
}

.cta:active{
  transform:scale(.97);
}

.cta svg{
  width:22px;
  height:22px;

  flex-shrink:0;
}


/* MICRO TEXT */

.micro-cta{
  margin-top:.8rem;

  font-size:.73rem;

  color:rgba(255,255,255,.5);

  animation:fadeUp .7s ease .68s both;
}

/* DESKTOP */

@media (min-width:641px){

  .bg-photo::after{
    background:
      linear-gradient(
        to right,
        rgba(7,16,24,.02) 0%,
        rgba(7,16,24,.45) 48%,
        rgba(7,16,24,.96) 100%
      ),
      linear-gradient(
        to top,
        rgba(7,16,24,.4) 0%,
        transparent 35%
      );
  }

  .hotzone{
    align-items:flex-end;
    text-align:right;

    padding:0 4rem 3rem;

    max-width:560px;

    margin-left:auto;
  }

  .profile-badge{
    align-self:flex-end;
  }

  .cta{
    max-width:340px;
  }

}

/* ANIMATIONS */

@keyframes fadeIn{
  from{
    opacity:0;
  }
  to{
    opacity:1;
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(14px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes pulse{
  0%,100%{
    opacity:1;
  }
  50%{
    opacity:.45;
  }
}

@keyframes floatButton{

  0%{
    transform:scale(1);
    box-shadow:
      0 12px 34px rgba(255,255,255,.18);
  }

  50%{
    transform:scale(1.07);
    box-shadow:
      0 18px 46px rgba(255,255,255,.32);
  }

  100%{
    transform:scale(1);
    box-shadow:
      0 12px 34px rgba(255,255,255,.18);
  }

}
  
</style>
</head>

<body>

<div class="page">

  <!-- BACKGROUND -->
  <div class="bg-photo">
    <img src="IMAGEN.png" alt="">
  </div>

  <!-- CONTENT -->
  <div class="hotzone">

    <!-- ONLINE -->
    <div class="profile-badge">
      <div class="online-dot"></div>
      <span>Anna is online now · replies on Telegram</span>
    </div>

    <!-- TITLE -->
    <h1>
      I have something<br>
      <em>just for you</em>
    </h1>

    <p class="sub">
      open my telegram VIP 😈
    </p>

    <!-- CTA -->
    <a
      href="https://t.me/USERNAME"
      class="cta"
      target="_blank"
      rel="noopener"
      onclick="fbq('track', 'Lead');"
    >

      Press /start to receive the gift

</svg>

    </a>

    <p class="micro-cta">
      Tap to open a private Telegram chat
    </p>

  </div>
</div>
